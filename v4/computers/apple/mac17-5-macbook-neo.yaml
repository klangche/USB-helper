platform: macos
chip_family: a-series
manufacturer: Apple Inc.
model: Mac17,5
name: MacBook Neo
chip: A18 Pro
computer_hubs: 2

displays:
  max_external: 1
  restrictions:
    - "Apple: one external display with up to 4K resolution at 60 Hz, on the USB 3 port only."

ports:
  usb3:
    usb: usb-c
    displayport_alt_mode: true
    limitations:
      - "USB 3 data (up to 10 Gb/s) and DisplayPort video; supports charging."
  usb2:
    usb: usb-c
    displayport_alt_mode: false
    limitations:
      - "USB 2 data only (up to 480 Mb/s), no DisplayPort video; supports charging."

notes:
  - "MacBook Neo (model A3404). Model identifier Mac17,5."
  - "Lightware: the MacBook Neo uses three USB tiers by itself out of the USB specification's seven; typical M-series MacBooks use two. Both USB-C ports use three tiers."
  - "chip_family a-series: the MacBook Neo is an A-series Mac and uses three of the seven tiers itself, one more than M-series Macs, which leaves three hubs (built_in_hub_levels 2 in platforms/macos.yaml; owner decision 2026-11-16; until then 4, from reading the three tiers as including the device)."
  - "displays.mst is inherited from platforms/macos.yaml (false). Only the USB 3 port carries video, so a second DisplayPort display can only mirror the first."
  - "Partial: every value is cited, but the pages were checked through search results (2026-11-16), not on a MacBook Neo. The three hubs are derived from Lightware's tier count and the USB seven-tier rule, not stated by Apple or Lightware."
  - "Not known: whether macOS lists the internal hub as a hub. If it does, the app run on a MacBook Neo counts it as an external hub (it says so in the log) and judges one hub too strict."
  - "computer_hubs 2: Lightware measured the MacBook Neo: it uses three USB tiers by itself on both USB-C ports (see the Lightware note above), the root hub and two hubs. Set here, not on the a-series chip, because only this model was measured (2026-11-19, #328)."

sources:

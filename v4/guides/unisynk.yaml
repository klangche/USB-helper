# =============================================================================
# Unisynk  –  the owner's own numbers, format v4 (#329)
# =============================================================================
# Moved one to one from v3: tiers 4 / 6, cameras and audio 3 / 4, and the
# chip and platform values. Not a manufacturer source, so no quotes.
# =============================================================================

name: Unisynk
selectable: true
proav: 1
own: true

measures:
  tiers:
    counts: [root_hub, computer_hub, hub, marked_hub, cable_length, device]
    computer_hub: { from: [detected, computer, chip], unknown: open }

rules:
  - { measure: tiers, recommended: 4, max: 6 }
  - { measure: tiers, devices: [camera], recommended: 3, max: 4 }
  - { measure: tiers, devices: [audio], recommended: 3, max: 4 }
  - { measure: tiers, on: [apple-mobile], recommended: 2, max: 3 }
  - { measure: tiers, on: [android], recommended: 2, max: 3 }
  - { measure: tiers, on: [windows/amd], recommended: 3, max: 5 }
  - { measure: tiers, on: [windows/arm], recommended: 3, max: 4 }
  - { measure: tiers, on: [macos/apple-silicon], recommended: 3, max: 5 }
  - { measure: tiers, on: [macos/a-series], recommended: 3, max: 4 }
  - { measure: tiers, on: [ubuntu/arm], recommended: 3, max: 4 }
  - { measure: tiers, on: [debian/arm], recommended: 3, max: 4 }

platforms:
  windows:
    mst: 1
    chips:
      intel: { mst: 1 }
      amd: { mst: 1 }
      arm: { mst: 0 }
  macos:
    mst: 0
    chips:
      intel: { mst: 0 }
      apple-silicon: { mst: 0 }
      a-series: { mst: 0 }
  ubuntu:
    mst: 0
    chips:
      intel: { mst: 0 }
      amd: { mst: 0 }
      arm: { mst: 0 }
  debian:
    mst: 0
    chips:
      intel: { mst: 0 }
      amd: { mst: 0 }
      arm: { mst: 0 }
  apple-mobile:
    mst: 0
    chips:
      a-series: { mst: 0 }
      m-series: { mst: 0 }
  android:
    mst: 0
    chips:
      phone-qualcomm: { mst: 0 }
      tablet-exynos: { mst: 0 }

notes:
  - "Moved to v4 on 2026-11-19 (#329): the tiers values one to one. v3's hubs per bus (3 / 5; Apple mobile and Android 1 / 2) are not a path measure in v4 and are not carried over. Not verified: Unisynk's numbers come from practical experience, not a published source."
  - "v3 source line, kept: USB-Helper base limits + Ochno-style conservatism on tiers"
  - "v3 source line, kept: Unisynk practical experience with switcher and extension topologies"

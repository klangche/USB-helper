# =============================================================================
# Extron  –  Manufacturer guide, format v4 (#329)
# =============================================================================
# Extron counts every hub between the host controller and the farthest
# peripheral, the hubs inside the computer included, and allows five
# ("five cascading hub limit"). Root hubs do not count. Extenders use one or
# two hubs and compound devices count. No separate rule for cameras or audio.
# Setups: a known computer gives an exact chain; an unknown one leaves it "at
# least"; marked hubs (extenders) count.
# =============================================================================

name: Extron
selectable: true
proav: 1
basis: { source: whitepaper, quote: "five cascading hub limit" }

sources:
  whitepaper:
    link: https://www.extron.com/article/understandingusbwp?tab=tools
    title: "Understanding USB in Professional AV Environments"
    author: Extron
    version: "Rev 1.0, 03/31/17"
    read: "a copy supplied by the owner (3878270 bytes, SHA-256 ff607ff629a566a2e2e59bff2ff44f5c6a5da74e745a0549435352a0b56358c9); the download needs a login, so no PDF link (#329)"
  article:
    link: https://www.extron.com/article/usb-c-connectivity-for-pro-av
    title: "USB-C for Pro AV"
    author: Extron

measures:
  chain:
    counts: [computer_hub, hub, marked_hub]
    computer_hub: { from: [detected, computer, chip], unknown: open }

rules:
  - { measure: chain, max: 5, source: whitepaper, quote: "count all of the hubs between the host controller and the farthest peripheral. This includes all of the hubs located inside any computer connected to the bus, plus all hubs enclosed within USB compound devices" }

platforms:
  windows:
    mst: 1
    chips:
      intel: { mst: 1 }
      amd: { mst: 1 }
      arm: { mst: 0 }
  macos:
    mst: 0
    chips:
      intel: { mst: 0 }
      apple-silicon: { mst: 0 }
      a-series: { mst: 0 }
  ubuntu:
    mst: 0
    chips:
      intel: { mst: 0 }
      amd: { mst: 0 }
      arm: { mst: 0 }
  debian:
    mst: 0
    chips:
      intel: { mst: 0 }
      amd: { mst: 0 }
      arm: { mst: 0 }
  apple-mobile:
    mst: 0
    chips:
      a-series: { mst: 0 }
      m-series: { mst: 0 }
  android:
    mst: 0
    chips:
      phone-qualcomm: { mst: 0 }
      tablet-exynos: { mst: 0 }

notes:
  - "Quotes (white paper, Rev 1.0, page 12 of the owner's copy): \"count all of the hubs between the host controller and the farthest peripheral. This includes all of the hubs located inside any computer connected to the bus, plus all hubs enclosed within USB compound devices\"; \"five cascading hub limit\"."
  - "Converted to v4 on 2026-11-19 (#329): chain = computer_hub + hub + marked_hub, max 5. The white paper's root hub and extender sentences were supplied on 2026-11-22 from a two-column text extraction, not yet checked against page 12, so they are not quoted; they follow as unchecked text."
  - "Unchecked extraction, page 12 (owner, 2026-11-22), root hub: A computer's USB host controller has a root hub as part of the host controller, but many computers that have USB ports on the front and rear of the unit include another hub within the computer that is connected to the root hub. Also, if a computer has a built‑in hub and a compound USB peripheral (e.g., a touch display), two hubs of the five cascading hub limit are already in use. In this case, only three more hubs can be daisy-chained to this system before the five cascading hub limit is reached."
  - "Unchecked extraction, page 12 (owner, 2026-11-22), extender, first part only: Extenders usually require that at least one or two hubs of the five cascading hub limit be used within the transmitter for emulation and \"keep alive\" functions"
  - "The white paper's fingerprint, for \"Open local file\" (#333): size 3878270 bytes, SHA-256 ff607ff629a566a2e2e59bff2ff44f5c6a5da74e745a0549435352a0b56358c9."
  - "v3 source line, kept: https://www.extron.com/article/usb-c-connectivity-for-pro-av"
  - "v3 source line, kept: Extron, USB-C for Pro AV design guide: seven tiers, so at most five additional hubs in the signal chain"
  - "v3 source line, kept: Extron: extender transmitter hubs (one or two) and receiver hubs count toward the five cascading hub limit"
  - "v3 link, kept: https://www.extron.com/article/usb-c-connectivity-for-pro-av"

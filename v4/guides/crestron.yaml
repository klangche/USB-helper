# =============================================================================
# Crestron  –  Manufacturer guide, format v4 (#329)
# =============================================================================
# Crestron counts tiers: the host is tier 1, the device the last tier, never
# more than 7. A laptop with several ports "must already have a hub", so when
# the computer's hubs are unknown Crestron assumes one; the database value wins
# where it is known. An active cable adds a tier per extra 5 m (USB 2) or 3 m
# (USB 3), marked by the user. No separate rule for cameras or audio.
# Setups: a known computer gives exact tiers; an unknown one counts one
# computer hub (unknown: 1); marked hubs and active cables add tiers.
# =============================================================================

name: Crestron
selectable: true
proav: 1
basis: { source: crestron, quote: "never more than 7 tiers" }

sources:
  crestron:
    link: https://community.crestron.com/s/article/3082#What_Is_A_Tier
    title: "USB Tiers (knowledge article 3082)"
    author: Crestron
    version: "Oct 22, 2026"
    read: "behind a Crestron login; the copy quoted in #325"

measures:
  tiers:
    counts: [root_hub, computer_hub, hub, marked_hub, cable_length, device]
    computer_hub: { from: [detected, computer, chip], unknown: 1 }
    cable_length: { usb2_metres_per_tier: 5, usb3_metres_per_tier: 3 }

rules:
  - { measure: tiers, max: 7, source: crestron, quote: "never more than 7 tiers" }

cables:
  notes:
    - { type: passive, bus: usb2, text: "passive USB 2 about 5 m per run", source: crestron, quote: "Passive USB 2 cabling should be limited to ~16.4 ft (5 m) per run, while USB 3 should be limited to ~9.8 ft (3 m)" }
    - { type: passive, bus: usb3, text: "passive USB 3 about 3 m per run", source: crestron, quote: "Passive USB 2 cabling should be limited to ~16.4 ft (5 m) per run, while USB 3 should be limited to ~9.8 ft (3 m)" }

notes:
  - "Quotes (Crestron 3082, Oct 22, 2026): \"never more than 7 tiers\"; a laptop with several ports \"must already have a hub\"; \"the laptop's built-in USB connectors are already tier 2\" (the reason for computer_hub unknown: 1)."
  - "Converted to v4 on 2026-11-19 (#329): tiers = root_hub + computer_hub + hub + marked_hub + cable_length + device, max 7. cable_length: the first 5 m (USB 2) or 3 m (USB 3) are free, then one tier per 5 m or 3 m; the app counts the marked tiers until cable marks with length (#331)."
  - "v3 source line, kept: https://community.crestron.com/s/article/3082#What_Is_A_Tier"
  - "v3 source line, kept: Crestron knowledge article 3082, USB Tiers (Oct 22, 2026): host tier 1, device the final tier, never more than 7 tiers"
  - "v3 source line, kept: Crestron: built-in host hubs, hub products with more than four ports and extender pairs each add tiers; an active cable adds a tier per extra 5 m (USB 2) or 3 m (USB 3)"
  - "v3 link, kept: https://community.crestron.com/s/article/3082#What_Is_A_Tier"

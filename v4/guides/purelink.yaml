# =============================================================================
# PureLink  –  Manufacturer guide, format v4 (#329)
# =============================================================================
# PureLink V6 counts tiers: at most 7 (USB-IF), ideally within four. It avoids
# fixed figures per chip family, so the computer's hubs count only from a
# computer file (a model); from a chip value they stay unknown and the result
# is "at least". No camera or audio rule: "more important than tier count
# alone". USB4 routers and logical layers are not counted as hubs.
# Setups: a computer file with computer_hubs gives exact tiers; a chip value
# or none leaves them "at least"; marked hubs and active cables add tiers.
# =============================================================================
# How to edit
#   Every key has a short comment saying what it means. Indent with spaces.
#   In a limit: empty or left out = not stated, a number = the limit,
#   none = deliberately no limit.
#   Long text goes in a block: a line ending in '>', then the text indented
#   below it, with no quotes or escapes.

name: PureLink  # the name in the menu
selectable: true  # true: it can be picked in the menu
proav: 1  # 1: ProAV, marked in the menu · 0: general purpose
basis:  # the words the philosophy is built on
  source: v6  # which source below
  quote: ideally within four tiers … a conservative design preference  # its words, copied exactly

sources:  # where the rules come from, each with a short name
  v6:  # the short name the rules use
    title: USB-C Technology whitepaper  # the document's title
    author: PureLink  # who wrote it
    version: V6  # which version or date
    read: >  # how USB-Helper read it
      the copy quoted in #325 and #329; not published, so no link
  pi6600:  # the short name the rules use
    link: >  # the web page
      https://www.purelink.de/en/connection-cables/usb/21002/premium-usb-3.2-gen1-micro-coax-usb-c-cable-5.00m
    title: Premium USB 3.2 Gen1 micro-coax USB-C cable 5.00m (21002)  # the document's title
    author: PureLink  # who wrote it
    read: >  # how USB-Helper read it
      values from the owner on #372 (the page could not be read from the agent environment)

counts: tiers  # chain = hubs in front of a device · tiers = USB tiers · room = only the room's hubs

computer_hubs:  # the hubs inside the computer
  use: measured, computer  # measured = this computer, computer = its file, chip = its chip's file
  if unknown: at least  # at least = the count is a minimum · a number = assume that many

limits:  # the numbers, for every device unless a scope below says otherwise
  tiers:  # what 'tiers' may reach
    recommended: 4  # a warning above this
    max: 7  # a fault above this
    source: v6  # which source above
    quote: ideally within four tiers … a conservative design preference  # its words, copied exactly

cables:  # notes on cable lengths and approved cable models; they never change a result
  notes:  # shown beside a cable of that type
    - type: passive  # the cable type: passive, active, active_optical or usb4
      bus: usb3  # usb2 or usb3; left out: both
      text: passive USB 3.2 Gen 1 about 2 m, Gen 2 about 1 m (indicative)  # the note shown beside the cable
      source: v6  # which source above
      quote: Practical passive-cable design guidance (not universal USB-IF length guarantees)  # its words, copied exactly
    - type: usb4  # the cable type: passive, active, active_optical or usb4
      text: passive USB4 / Thunderbolt about 0.8–1 m (indicative)  # the note shown beside the cable
      source: v6  # which source above
      quote: Practical passive-cable design guidance (not universal USB-IF length guarantees)  # its words, copied exactly
    - type: usb4  # the cable type: passive, active, active_optical or usb4
      text: >  # the note shown beside the cable
        Thunderbolt 4: universal 2-metre cable compatibility
      source: v6  # which source above
      quote: universal 2-metre cable compatibility  # its words, copied exactly
    - type: active_optical  # the cable type: passive, active, active_optical or usb4
      text: active optical cables up to 15 m (indicative)  # the note shown beside the cable
      source: v6  # which source above
      quote: Active optical (AOC) cables can manage up to 15m  # its words, copied exactly
  models:  # cables this philosophy names
    - name: PureInstall PI6600 (21002)  # the model's name
      type: passive  # the cable type: passive, active, active_optical or usb4
      length: 5  # in metres
      bus: usb3  # usb2 or usb3; left out: both
      speed: USB 3.2 Gen 1  # the data speed, as stated
      note: micro-coax USB-C to USB-C  # shown with the model
      source: pi6600  # which source above

notes:  # background, kept word for word
  - >
    Quote (PureLink V6, supplied by the owner 2026-11-22), the rule's max 7: "USB supports a maximum
    of seven tiers along any individual connection path. Tier 1 is the host and its integrated root
    hub, Tiers 2–6 can contain up to five additional hubs, and Tier 7 is reserved for the final USB
    device." One rule holds both numbers, so its quote is the recommendation.
  - >
    Quotes (PureLink V6): "ideally within four tiers … a conservative design preference"; "Avoid
    fixed per-chip-family tier figures unless backed by reproducible model/OS measurements";
    "Scheduling, sufficient bandwidth, power and compatibility are more important than tier count
    alone" (so no camera or audio rule).
  - >
    Converted to v4 on 2026-11-19 (#329), following V6, which replaced the v3 whitepaper source
    below.
  - >
    v3 source line, kept: PureLink, USB-C Technology whitepaper v3 (Robin Cullen, 8 Oct 2025), not
    published yet
  - >
    v3 source line, kept: PureLink: maximum seven tiers on a connection path; the limit is hubs in
    series, not the total number of hubs
  - >
    v3 source line, kept: PureLink: ideally within four tiers in ProAV; webcams and audio interfaces
    3–4 tiers at most

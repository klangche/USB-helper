# =============================================================================
# PureLink  –  Manufacturer guide, format v4 (#329)
# =============================================================================
# PureLink V6 counts tiers: at most 7 (USB-IF), ideally within four. It avoids
# fixed figures per chip family, so the computer's hubs count only from a
# computer file (a model); from a chip value they stay unknown and the result
# is "at least". No camera or audio rule: "more important than tier count
# alone". USB4 routers and logical layers are not counted as hubs.
# Setups: a computer file with computer_hubs gives exact tiers; a chip value
# or none leaves them "at least"; marked hubs and active cables add tiers.
# =============================================================================

name: PureLink
selectable: true
proav: 1
basis: { source: v6, quote: "ideally within four tiers … a conservative design preference" }

sources:
  v6:
    title: "USB-C Technology whitepaper"
    author: PureLink
    version: "V6"
    read: "the copy quoted in #325 and #329; not published, so no link"
  pi6600:
    link: https://www.purelink.de/en/connection-cables/usb/21002/premium-usb-3.2-gen1-micro-coax-usb-c-cable-5.00m
    title: "Premium USB 3.2 Gen1 micro-coax USB-C cable 5.00m (21002)"
    author: PureLink
    read: "values from the owner on #372 (the page could not be read from the agent environment)"

measures:
  tiers:
    counts: [root_hub, computer_hub, hub, marked_hub, cable_length, device]
    computer_hub: { from: [detected, computer], unknown: open }

rules:
  - { measure: tiers, recommended: 4, max: 7, source: v6, quote: "ideally within four tiers … a conservative design preference" }

cables:
  notes:
    - { type: passive, bus: usb3, text: "passive USB 3.2 Gen 1 about 2 m, Gen 2 about 1 m (indicative)", source: v6, quote: "Practical passive-cable design guidance (not universal USB-IF length guarantees)" }
    - { type: usb4, text: "passive USB4 / Thunderbolt about 0.8–1 m (indicative)", source: v6, quote: "Practical passive-cable design guidance (not universal USB-IF length guarantees)" }
    - { type: usb4, text: "Thunderbolt 4: universal 2-metre cable compatibility", source: v6, quote: "universal 2-metre cable compatibility" }
    - { type: active_optical, text: "active optical cables up to 15 m (indicative)", source: v6, quote: "Active optical (AOC) cables can manage up to 15m" }
  models:
    - { name: "PureInstall PI6600 (21002)", type: passive, length: 5, bus: usb3, speed: "USB 3.2 Gen 1", note: "micro-coax USB-C to USB-C", source: pi6600 }

notes:
  - "Quote (PureLink V6, supplied by the owner 2026-11-22), the rule's max 7: \"USB supports a maximum of seven tiers along any individual connection path. Tier 1 is the host and its integrated root hub, Tiers 2–6 can contain up to five additional hubs, and Tier 7 is reserved for the final USB device.\" One rule holds both numbers, so its quote is the recommendation."
  - "Quotes (PureLink V6): \"ideally within four tiers … a conservative design preference\"; \"Avoid fixed per-chip-family tier figures unless backed by reproducible model/OS measurements\"; \"Scheduling, sufficient bandwidth, power and compatibility are more important than tier count alone\" (so no camera or audio rule)."
  - "Converted to v4 on 2026-11-19 (#329), following V6, which replaced the v3 whitepaper source below."
  - "v3 source line, kept: PureLink, USB-C Technology whitepaper v3 (Robin Cullen, 8 Oct 2025), not published yet"
  - "v3 source line, kept: PureLink: maximum seven tiers on a connection path; the limit is hubs in series, not the total number of hubs"
  - "v3 source line, kept: PureLink: ideally within four tiers in ProAV; webcams and audio interfaces 3–4 tiers at most"

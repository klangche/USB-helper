name: Release

# Tags vX.Y.Z on main build the portable Windows zip and publish a GitHub release.
# Pull requests that change the packaging build the zip as an artifact only.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release/**
      - src/UsbHelper.App/**
      - Directory.Build.props
      - "**/packages.lock.json"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw "Releases build only from tags on main." }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '0.0.0-pr'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: dotnet restore --locked-mode

      - run: dotnet test --no-restore -c Release

      - run: dotnet restore src/UsbHelper.App -r win-x64 --locked-mode

      - name: Publish
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $name = "usb-helper-$version-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item publish/UsbHelper.App.exe "$name/USB-helper.exe"
          Copy-Item -Recurse publish/database "$name/database"
          # CRLF, so older Notepad versions show the lines.
          (Get-Content release/READ_ME_FIRST.txt -Raw).Replace('{version}', $version).Replace("`n", "`r`n") | Set-Content -NoNewline "$name/READ_ME_FIRST.txt"
          Copy-Item LICENSE "$name/LICENSE.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: ${{ env.ZIP }}

  # Only this job can write to the repository, and only for tags.
  github-release:
    needs: windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-zip

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" usb-helper-*-windows-x64.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

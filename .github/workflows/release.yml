name: Release

# A release of main, started from the Actions page ("Run workflow", version X.Y.Z) or by
# pushing a tag vX.Y.Z on main, builds the portable Windows zip and publishes a GitHub release.
# Pull requests that change the packaging build the zip as an artifact only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (for example 0.1.0)"
        required: true
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release/**
      - src/UsbHelper.App/**
      - Directory.Build.props
      - "**/packages.lock.json"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "Releases build only from main." }
            $version = $env:INPUT_VERSION.Trim()
            if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "Version must be X.Y.Z, for example 0.1.0." }
            git rev-parse -q --verify "refs/tags/v$version"
            if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists." }
            $global:LASTEXITCODE = 0
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw "Releases build only from tags on main." }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '0.0.0-pr'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: dotnet restore --locked-mode

      - run: dotnet test --no-restore -c Release

      - run: dotnet restore src/UsbHelper.App -r win-x64 --locked-mode

      - name: Publish
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $name = "usb-helper-$version-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item publish/UsbHelper.App.exe "$name/USB-helper.exe"
          Copy-Item -Recurse publish/database "$name/database"
          # CRLF, so older Notepad versions show the lines.
          (Get-Content release/READ_ME_FIRST.txt -Raw).Replace('{version}', $version).Replace("`n", "`r`n") | Set-Content -NoNewline "$name/READ_ME_FIRST.txt"
          Copy-Item LICENSE "$name/LICENSE.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: ${{ env.ZIP }}

  # Only this job can write to the repository, and never for pull requests.
  github-release:
    needs: windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-zip

      # Creates the tag on the built commit when it does not exist yet (release started from the Actions page).
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.windows.outputs.version }}
        run: gh release create "$TAG" usb-helper-*-windows-x64.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes

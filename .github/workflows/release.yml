name: Release

# Merging the dev -> main pull request (with a merge commit) makes a release when the titles of the
# pull requests merged since the last release ask for one (release/next-version.sh picks the version):
# it builds the portable Windows zip (a USB-helper folder: USB-helper.exe and the app's loose files in app/, #123, #130)
# and the per-user .msi (#124)
# from the same files, creates the tag vX.Y.Z and publishes a GitHub release.
# Every merge into dev publishes a pre-release vX.Y.Z-beta.N the same way: X.Y.Z is that next version,
# N counts the earlier betas of it (release/beta-version.sh). Beta tags never count as a release.
# Pull requests that change the packaging build the zip and the .msi as artifacts only.
on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - release/**
      - installer/**
      - src/UsbHelper.Starter/**
      - .config/dotnet-tools.json
      - src/UsbHelper.App/**
      - Directory.Build.props
      - "**/packages.lock.json"

permissions:
  contents: read

# Releases run one at a time per branch, so each one sees the tags of the earlier runs on its branch.
# A dev run that overlaps a main release does not see that release's tag yet; the next dev run does.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      last: ${{ steps.version.outputs.last }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test release scripts
        run: |
          release/next-version.test.sh
          release/tags.test.sh
          release/msi-version.test.sh

      - name: Version
        id: version
        # bash -eo pipefail: a failed API call inside the pipeline must fail the step.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # A version below every release, so a pull request build offers the newest stable and beta as updates.
            version="0.0.0-pr.$PR_NUMBER.$GITHUB_RUN_NUMBER"
          else
            # The highest release tag, not git describe: the release tag sits on the merge commit on main,
            # which dev does not contain.
            last=$(git tag --list | release/last-release.sh)
            # Every commit since the last release, also those that came in through dev, so every pull request
            # merged into dev counts, not only the dev -> main pull request.
            commits=$(git rev-list "${last:+$last..}HEAD")
            # exit 1: a failed API call must stop the release, not drop a title.
            version=$(
              for sha in $commits; do
                gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                  --jq '.[] | select(.merged_at != null) | "\(.number)\t\(.title)"' || exit 1
              done | sort -u -t$'\t' -k1,1n | cut -f2- | release/next-version.sh "$last"
            )
            if [ -n "$version" ] && [ "$GITHUB_REF_NAME" = dev ]; then
              version=$(git tag --list | release/beta-version.sh "$version")
            fi
            echo "Last release: ${last:-none}. Next: ${version:-no release}."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode

      - run: dotnet test --no-restore -c Release

      # Loose files (#123): the exe, its DLLs and the .NET runtime in one folder, ReadyToRun, not trimmed. No single file:
      # nothing is extracted or unpacked at start.
      - name: Publish app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r win-x64 --self-contained
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }} -o publish

      # USB-helper.exe (#130): NativeAOT, so it starts app\UsbHelper.exe within milliseconds and needs no .NET runtime.
      - name: Publish starter
        run: >-
          dotnet publish src/UsbHelper.Starter --no-restore -c Release -r win-x64
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }} -o starter

      # Signing (#112) adds one step here: sign USB-helper.exe, UsbHelper.exe and the project's own DLLs before they are
      # packaged, and one after "MSI": sign the .msi.

      # The layout of the zip's USB-helper folder and the .msi's install folder (#130): USB-helper.exe, READ_ME_FIRST.txt,
      # LICENSE.txt and the folder "app" with everything else. Native packages put their .pdb files (about 100 MB) into
      # the publish folder despite DebugType=none (#122); they are left out.
      - name: Layout
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          New-Item -ItemType Directory layout/app | Out-Null
          Copy-Item starter/USB-helper.exe layout
          Copy-Item publish/* layout/app -Recurse -Exclude *.pdb
          # CRLF, so older Notepad versions show the lines.
          (Get-Content release/READ_ME_FIRST.txt -Raw).Replace('{version}', $version).Replace("`n", "`r`n") | Set-Content -NoNewline layout/READ_ME_FIRST.txt
          Copy-Item LICENSE layout/LICENSE.txt
          if (Get-ChildItem layout -Recurse -Filter *.pdb) { throw "The layout holds .pdb files." }
          $top = (Get-ChildItem layout).Name | Sort-Object
          if (($top -join ',') -ne 'app,LICENSE.txt,READ_ME_FIRST.txt,USB-helper.exe') { throw "Unexpected top level: $($top -join ', ')" }
          "NAME=usb-helper-$version-windows-x64" >> $env:GITHUB_ENV

      # The zip holds one folder, USB-helper, with the layout in it, so unzipping gives one folder to start from.
      # ZipFile, not Compress-Archive: entry names with "/", as every unzip tool expects.
      - name: Zip
        shell: pwsh
        run: |
          $name = $env:NAME
          New-Item -ItemType Directory "zip/USB-helper" | Out-Null
          Copy-Item layout/* "zip/USB-helper" -Recurse
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$PWD/zip", "$PWD/$name.zip", [IO.Compression.CompressionLevel]::Optimal, $false)
          # The top level is exactly USB-helper.exe, the two text files and app/ (#130); the app's update (#123) needs
          # USB-helper/USB-helper.exe and USB-helper/app/UsbHelper.exe; no launcher (#110) may be left in the zip.
          $archive = [IO.Compression.ZipFile]::OpenRead("$PWD/$name.zip")
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          $top = @('USB-helper/USB-helper.exe', 'USB-helper/READ_ME_FIRST.txt', 'USB-helper/LICENSE.txt')
          foreach ($needed in $top + 'USB-helper/app/UsbHelper.exe') {
            if ($entries -notcontains $needed) { throw "The zip has no $needed." }
          }
          if ($entries | Where-Object { $_ -notin $top -and $_ -notlike 'USB-helper/app/*' }) { throw "The zip holds files outside USB-helper/app/ other than the top three." }
          if ($entries | Where-Object { $_ -like '*Launcher*' }) { throw "The zip holds a launcher." }
          "$($entries.Count) files in $name.zip, $([math]::Round((Get-Item "$name.zip").Length / 1MB, 1)) MB:"
          $entries | Where-Object { $_ -notlike 'USB-helper/app/*' }
          "USB-helper/app/: $(@($entries | Where-Object { $_ -like 'USB-helper/app/*' }).Count) files"

      # Starts USB-helper.exe from the unzipped zip and waits for the app's window (#130), as a user would.
      - name: Start test (zip)
        shell: pwsh
        run: |
          . release/start-test.ps1
          Expand-Archive "$env:NAME.zip" start-test
          Test-Start "$PWD\start-test\USB-helper\USB-helper.exe"

      # MSI versions have no pre-release part: release/msi-version.sh maps X.Y.Z-beta.N to X.Y.(Z*1000+N) and X.Y.Z to
      # X.Y.(Z*1000+999), so betas and releases upgrade each other in order.
      - name: MSI version
        shell: bash
        run: echo "MSI_VERSION=$(release/msi-version.sh '${{ needs.version.outputs.version }}')" >> "$GITHUB_ENV"

      # WiX Toolset, pinned in .config/dotnet-tools.json.
      - name: MSI
        shell: pwsh
        run: |
          . release/build-msi.ps1
          Build-Msi '${{ needs.version.outputs.version }}' $env:MSI_VERSION "$env:NAME.msi"
          "$env:NAME.msi: ProductVersion $env:MSI_VERSION, $([math]::Round((Get-Item "$env:NAME.msi").Length / 1MB, 1)) MB"
          # The last page's "Launch USB-helper" exists and is ticked by default (#147), and the launch action is in.
          dotnet wix msi decompile "$env:NAME.msi" -o decompiled.wxs -x decompiled
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [xml] $package = Get-Content decompiled.wxs -Raw
          $properties = @{}
          $package.SelectNodes("//*[local-name()='Property']") | ForEach-Object { $properties[$_.Id] = $_.Value }
          if ($properties['WIXUI_EXITDIALOGOPTIONALCHECKBOX'] -ne '1') { throw "Launch USB-helper is not ticked by default." }
          if ($properties['WIXUI_EXITDIALOGOPTIONALCHECKBOXTEXT'] -ne 'Launch USB-helper') { throw "The last page has no Launch USB-helper box." }
          if (-not $package.SelectNodes("//*[local-name()='CustomAction' and @Id='LaunchApplication']").Count) { throw "No LaunchApplication action." }
          "Last page: '$($properties['WIXUI_EXITDIALOGOPTIONALCHECKBOXTEXT'])', ticked by default"
          # The setup windows show the app icon (#204): the .msi carries installer/dialog.bmp and banner.bmp.
          foreach ($image in @(@('WixUI_Bmp_Dialog', 'installer/dialog.bmp'), @('WixUI_Bmp_Banner', 'installer/banner.bmp'))) {
            $binary = $package.SelectSingleNode("//*[local-name()='Binary' and @Id='$($image[0])']")
            if (-not $binary) { throw "The .msi has no $($image[0])." }
            $file = @($binary.SourceFile, (Join-Path decompiled $binary.SourceFile)) | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) } | Select-Object -First 1
            if (-not $file -or (Get-FileHash $file).Hash -ne (Get-FileHash $image[1]).Hash) { throw "$($image[0]) in the .msi is not $($image[1]) ($($binary.SourceFile))." }
          }
          "Setup images: installer/dialog.bmp and installer/banner.bmp"

      # Installs the .msi as the runner's user, checks the files, the Start menu shortcut and the Apps & features entry,
      # checks that nothing starts by itself, starts the app through the shortcut's target, upgrades it with a newer build
      # of the same files with LAUNCHAPPONEXIT=1 and waits for the new version's window (#147), and uninstalls.
      # /qn: no window. The runner's user is an administrator, so this cannot show that no UAC prompt appears;
      # Scope="perUser" in installer/Package.wxs does.
      - name: Test MSI
        shell: pwsh
        run: |
          . release/start-test.ps1
          $folder = "$env:LOCALAPPDATA\Programs\USB-helper"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\USB-helper.lnk"
          # Installed products as Windows Installer records them (Apps & features shows the same). A per-user .msi writes no
          # HKCU Uninstall key; its entry is under the user's own SID, not under S-1-5-18 (per machine).
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          function Entries {
            @(Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\$sid\Products" -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ItemProperty "$($_.PSPath)\InstallProperties" -ErrorAction SilentlyContinue } |
              Where-Object DisplayName -eq 'USB-helper')
          }
          function Msiexec($arguments) {
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode) { Get-Content msi.log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "msiexec $arguments exited with $($process.ExitCode)." }
          }
          function Files($path) { (Get-ChildItem $path -Recurse -File).FullName.Substring($path.Length) | Sort-Object }
          Msiexec "/i $env:NAME.msi /qn /l*v msi.log"
          # Without LAUNCHAPPONEXIT (and with no last page under /qn) nothing starts.
          Assert-NotRunning $folder 'install without LAUNCHAPPONEXIT'
          if (Compare-Object (Files $folder) (Files "$PWD\layout")) { throw "$folder does not hold the same files as the zip's USB-helper folder." }
          if (-not (Test-Path $shortcut)) { throw "No Start menu shortcut." }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne "$folder\USB-helper.exe") { throw "The shortcut starts $target, not $folder\USB-helper.exe." }
          if ((Entries).Count -ne 1) { throw "Windows Installer does not list USB-helper once for this user." }
          "Installed: $((Files $folder).Count) files, version $((Entries)[0].DisplayVersion); top level: $((Get-ChildItem $folder).Name -join ', ')"
          Test-Start $target
          # A newer .msi (build + 1) upgrades in place: still one entry, with the new version. LAUNCHAPPONEXIT=1, as the app's
          # own update passes it (#147): the new version starts when the install is done.
          . release/build-msi.ps1
          $parts = $env:MSI_VERSION.Split('.')
          $newer = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          Build-Msi upgrade-test $newer upgrade-test.msi
          Msiexec "/i upgrade-test.msi /qn LAUNCHAPPONEXIT=1 /l*v msi.log"
          if ((Entries).Count -ne 1 -or (Entries)[0].DisplayVersion -ne $newer) { throw "The newer .msi did not upgrade in place." }
          "Upgraded to $newer"
          Wait-Window $folder 'started by the .msi with LAUNCHAPPONEXIT=1'
          Msiexec "/x upgrade-test.msi /qn /l*v msi.log"
          if ((Test-Path $folder) -or (Test-Path $shortcut) -or (Entries).Count) { throw "Uninstall left the folder, the shortcut or the entry." }
          "Uninstalled"

      # The app's update check (#111, #124) verifies a download against these files (sha256sum format, LF).
      - name: Checksums
        shell: pwsh
        run: |
          foreach ($file in "$env:NAME.zip", "$env:NAME.msi") {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -NoNewline -Path "$file.sha256" -Value "$hash  $file`n"
            Get-Content "$file.sha256"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}.zip.sha256
            ${{ env.NAME }}.msi
            ${{ env.NAME }}.msi.sha256

  # Only this job can write to the repository, and never for pull requests.
  github-release:
    needs: [version, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows

      # Creates the tag on the built commit. Notes start at the last release, not the last beta.
      # A push to dev publishes a pre-release.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          LAST: ${{ needs.version.outputs.last }}
        shell: bash
        run: |
          args=()
          if [ -n "$LAST" ]; then
            args+=(--notes-start-tag "$LAST")
          fi
          if [ "$GITHUB_REF_NAME" = dev ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" usb-helper-*-windows-x64.zip usb-helper-*-windows-x64.zip.sha256 usb-helper-*-windows-x64.msi usb-helper-*-windows-x64.msi.sha256 --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${args[@]}"

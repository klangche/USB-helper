name: macOS trial builds

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode

      - run: dotnet build --no-restore -c Release

      - run: dotnet format --verify-no-changes --no-restore

      - run: dotnet test --no-build -c Release

      - name: Publish ARM64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-arm64 --self-contained
          -p:DebugType=none -p:Version=0.0.0-ci -o publish/osx-arm64

      - name: Publish x64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-x64 --self-contained
          -p:DebugType=none -p:Version=0.0.0-ci -o publish/osx-x64

      - name: Build universal app package
        run: bash release/build-macos-package.sh publish/osx-arm64 publish/osx-x64 0.0.0-ci package

      - name: Test package layout
        run: bash release/macos-package.test.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-trial-${{ github.run_id }}
          path: |
            package/usb-helper-*.dmg
            package/usb-helper-*.dmg.sha256

  # An isolated pre-release for downloading the dmg directly (artifacts are zip-wrapped, which macOS blocks).
  # The tag macos-trial is not vX.Y.Z[-beta.N], so the Windows version scripts and the updater ignore it.
  # To drop macOS: delete this job, then the macos-trial release and tag.
  trial-release:
    needs: macos
    if: github.event_name != 'pull_request' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    concurrency: macos-trial-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: macos-trial-*
          merge-multiple: true

      - name: Replace the macos-trial pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete macos-trial --cleanup-tag --yes || true
          gh release create macos-trial usb-helper-*-macos-universal.dmg usb-helper-*-macos-universal.dmg.sha256 \
            --target "$GITHUB_SHA" --title "macOS trial (unsigned)" --prerelease --latest=false \
            --notes "Unsigned macOS trial build of $GITHUB_SHA, not a release. Open the .dmg, drag USB-helper.app to Applications, and read READ_ME_FIRST.txt in the disk image. Replaced on every push to dev."

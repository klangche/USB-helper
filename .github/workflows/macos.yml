name: macOS trial builds

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode

      - run: dotnet build --no-restore -c Release

      - run: dotnet format --verify-no-changes --no-restore

      - run: dotnet test --no-build -c Release

      - name: Publish ARM64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-arm64 --self-contained
          -p:DebugType=none -p:Version=0.0.0-ci -o publish/osx-arm64

      - name: Publish x64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-x64 --self-contained
          -p:DebugType=none -p:Version=0.0.0-ci -o publish/osx-x64

      - name: Build universal app package
        run: bash release/build-macos-package.sh publish/osx-arm64 publish/osx-x64 0.0.0-ci package

      - name: Test package layout
        run: bash release/macos-package.test.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-trial-${{ github.run_id }}
          path: |
            package/usb-helper-*.dmg
            package/usb-helper-*.dmg.sha256


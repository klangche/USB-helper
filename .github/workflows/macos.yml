name: macOS trial builds

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach a dmg built from this tag to its existing release (for example v0.7.0). Empty: trial build only."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode

      - run: dotnet build --no-restore -c Release

      - run: dotnet format --verify-no-changes --no-restore

      # A hung test fails within minutes, not after the six-hour job limit (#245).
      - run: dotnet test --no-build -c Release --blame-hang-timeout 5m
        timeout-minutes: 20

      - name: Publish ARM64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-arm64 --self-contained
          -p:DebugType=none -p:Version=0.0.0-ci -o publish/osx-arm64

      - name: Publish x64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-x64 --self-contained
          -p:DebugType=none -p:Version=0.0.0-ci -o publish/osx-x64

      - name: Build universal app package
        run: bash release/build-macos-package.sh publish/osx-arm64 publish/osx-x64 0.0.0-ci package

      - name: Test package layout
        run: bash release/macos-package.test.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-trial-${{ github.run_id }}
          path: |
            package/usb-helper-*.dmg
            package/usb-helper-*.dmg.sha256

  # The dmg of a beta (push to dev) or a release (push to main). It is attached to the release of this commit after
  # the Windows release workflow has published it, in its own workflow so a macOS runner queue never delays or fails
  # the Windows release. Run by hand with a tag, it attaches a dmg built from that tag to its existing release.
  # The runs of this workflow are not serialized; a failed or cancelled run is visible and can be re-run.
  find-release:
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find the release to attach the dmg to
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release view "$INPUT_TAG" --json tagName --jq .tagName >/dev/null
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = main ]; then
            filter='(.prerelease | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))'
            kind=release
          else
            filter='.prerelease and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$"))'
            kind=beta
          fi
          for _ in $(seq 1 60); do
            tag=$(gh api "repos/$GH_REPO/releases?per_page=20" --jq "[.[] | select(.target_commitish == \"$GITHUB_SHA\" and $filter)] | first | .tag_name // empty")
            if [ -n "$tag" ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 60
          done
          echo "::error::No $kind of $GITHUB_SHA appeared within an hour (did the Windows release fail or make no $kind?)."
          exit 1

  dmg:
    needs: find-release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The tag's commit: the pushed commit on a push, the given tag when run by hand.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.find-release.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore --locked-mode

      # Unlock code secrets (#234): only these two steps get them. This job runs only for a beta or release dmg (a push
      # or a run by hand), never for a pull request; the trial build above stays keyless. The free-unlock switch (#238),
      # the Actions variable USBH_FREE_UNLOCK, goes to the same two steps only. Key 0 is the beta key (#252): only a beta
      # dmg (a tag ending in -beta.N) gets it, so a release dmg never accepts keyId 0 codes. Key 1 goes to both.
      - name: Publish ARM64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-arm64 --self-contained
          -p:DebugType=none "-p:Version=${TAG#v}" -o publish/osx-arm64
        env:
          TAG: ${{ needs.find-release.outputs.tag }}
          USBH_LICENCE_KEY_0: ${{ contains(needs.find-release.outputs.tag, '-beta.') && secrets.USBH_LICENCE_KEY_0 || '' }}
          USBH_LICENCE_KEY_1: ${{ secrets.USBH_LICENCE_KEY_1 }}
          USBH_FREE_UNLOCK: ${{ vars.USBH_FREE_UNLOCK }}

      - name: Publish x64 app
        run: >-
          dotnet publish src/UsbHelper.App --no-restore -c Release -r osx-x64 --self-contained
          -p:DebugType=none "-p:Version=${TAG#v}" -o publish/osx-x64
        env:
          TAG: ${{ needs.find-release.outputs.tag }}
          USBH_LICENCE_KEY_0: ${{ contains(needs.find-release.outputs.tag, '-beta.') && secrets.USBH_LICENCE_KEY_0 || '' }}
          USBH_LICENCE_KEY_1: ${{ secrets.USBH_LICENCE_KEY_1 }}
          USBH_FREE_UNLOCK: ${{ vars.USBH_FREE_UNLOCK }}

      - name: Build and test the disk image
        env:
          TAG: ${{ needs.find-release.outputs.tag }}
        run: |
          bash release/build-macos-package.sh publish/osx-arm64 publish/osx-x64 "${TAG#v}" package
          bash release/macos-package.test.sh

      - name: Attach the dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.find-release.outputs.tag }}
        run: gh release upload "$TAG" package/usb-helper-*-macos-universal.dmg package/usb-helper-*-macos-universal.dmg.sha256 --clobber

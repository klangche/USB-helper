name: Clean up branches

# Started by hand from the Actions tab (#323), so the owner can tidy branches from GitHub web alone.
# Deletes a branch only when its work is already in dev or main, or its pull request was merged.
# main, dev and database are never touched; every other branch is listed in the run summary, not deleted.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete merged branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=() kept=()
          while read -r branch; do
            case "$branch" in main|dev|database|HEAD) continue ;; esac
            reason=""
            if git merge-base --is-ancestor "origin/$branch" origin/dev; then
              reason="its work is in dev"
            elif git merge-base --is-ancestor "origin/$branch" origin/main; then
              reason="its work is in main"
            elif [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state merged --json number --jq length)" != 0 ]; then
              reason="its pull request was merged"
            fi
            if [ -z "$reason" ]; then
              kept+=("$branch")
              continue
            fi
            if [ "$DRY_RUN" != true ]; then
              gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
            deleted+=("$branch ($reason)")
          done < <(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin)

          {
            if [ "$DRY_RUN" = true ]; then echo "## Would delete ${#deleted[@]} branches (dry run)"; else echo "## Deleted ${#deleted[@]} branches"; fi
            for line in "${deleted[@]}"; do echo "- $line"; done
            echo
            echo "## Kept ${#kept[@]} branches (not merged; delete by hand if unwanted)"
            for line in "${kept[@]}"; do echo "- $line"; done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

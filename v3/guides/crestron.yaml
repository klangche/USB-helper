# =============================================================================
# Crestron  –  Manufacturer guide
# =============================================================================
# From Crestron's knowledge article 3082 "USB Tiers" (Oct 22, 2026; behind a
# Crestron login). "The host is always tier 1 and the device is always the
# final tier." "There can never be more than 7 tiers in a single USB signal
# chain. Beyond 7 tiers, devices will fail to enumerate." A laptop's internal
# hub already makes its ports tier 2 (the chip's built-in hub levels here), hub
# products with more than four ports hold two hubs, extender pairs commonly use
# two tiers, and an active cable adds a tier for each extra 5 m (USB 2) or 3 m
# (USB 3): mark it "+1 Tier". So Crestron counts tiers only, at most 7, with no
# separate recommendation and no camera rule.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: Crestron
selectable: true
proav: 1                              # 1: ProAV guide (marked in the menu), 0: general purpose
count: [tiers]                        # Crestron counts tiers on each signal chain
link: https://community.crestron.com/s/article/3082#What_Is_A_Tier

# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:                            # not counted by Crestron
    recommended:
    max:
  tiers:                           # "never more than 7 tiers in a single USB signal chain"
    recommended: none
    max: 7
  chain:                           # not counted by Crestron
    recommended:
    max:
  buses:                              # empty: this guide's hubs above, then USB-Helper's
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:                       # no camera or audio rule in the article
    tiers:
      recommended: none
      max: none
    chain:
      recommended: none
      max: none
  exceeded_note: "Crestron: never more than 7 tiers; beyond that devices fail to enumerate."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 0                            # macOS does not extend the desktop over DisplayPort MST (owner decision 2026-11-17)
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      apple-silicon:
        mst: 0
        limits: {}

      a-series:
        mst: 0
        limits: {}


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits: {}

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits: {}

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:
        mst: 0
        limits: {}


# -----------------------------------------------------------------------------
sources:
  - "https://community.crestron.com/s/article/3082#What_Is_A_Tier"
  - "Crestron knowledge article 3082, USB Tiers (Oct 22, 2026): host tier 1, device the final tier, never more than 7 tiers"
  - "Crestron: built-in host hubs, hub products with more than four ports and extender pairs each add tiers; an active cable adds a tier per extra 5 m (USB 2) or 3 m (USB 3)"

# =============================================================================
# Ochno  –  Manufacturer guide
# =============================================================================
# From Ochno's "Guide: USB hub chains in video conference room" (Johan
# Niininen, updated Oct 28). Ochno counts hubs daisy-chained in front of a
# device, not tiers: "having max 5 usb hubs daisy-chained", and "the max 5
# hub hops is the same for USB 2.0 and USB 3.2". Root hubs do not count; a
# laptop's additional non-root internal hub does, so "to ensure that the
# video conference room works with 100% of all laptops, the max available
# hubs are 4". The built-in hub levels of each chip give that here.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: Ochno
selectable: true
proav: 1                              # 1: ProAV guide (marked in the menu), 0: general purpose
count: [chain]                        # Ochno counts hubs daisy-chained in front of a device
link: https://ochno.atlassian.net/wiki/spaces/~ocs/pages/1114996744/Guide+USB+hub+chains+in+video+conference+room


# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:                               # not counted by Ochno
    recommended:
    max:
  tiers:                              # not counted by Ochno
    recommended:
    max:
  chain:                              # "max 5 usb hubs daisy-chained", built-in laptop hubs included
    recommended: none                 # the guide gives one hard limit
    max: 5
  buses:                              # not counted by Ochno
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:                       # the guide has no separate limit for cameras and audio
    tiers:
      recommended:
      max:
    chain:
      recommended: none
      max: none
  exceeded_note: "Ochno: at most 5 USB hubs daisy-chained, a laptop's internal hub included."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1                            # O-PC-4 has internal DP MST
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 0                            # macOS does not extend the desktop over DisplayPort MST (owner decision 2026-11-17)
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      apple-silicon:
        mst: 0
        limits: {}

      a-series:
        mst: 0
        limits: {}


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits: {}

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits: {}

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:
        mst: 0
        limits: {}


# -----------------------------------------------------------------------------
sources:
  - "https://ochno.atlassian.net/wiki/spaces/~ocs/pages/1114996744/Guide+USB+hub+chains+in+video+conference+room"
  - "Ochno: max 5 USB hubs daisy-chained, the same for USB 2.0 and USB 3.2; root hubs do not count, a laptop's non-root internal hub does (MacBook Pro M-series, other ARM laptops and Chromebooks, a few Intel laptops), so 4 for all laptops; docks have at least 2 hubs inside, Ethernet extenders 1–2, active electrical cables use hubs as re-drivers, active optical cables usually 1–2, interactive displays at least 2; many videobars, cameras and audio devices have internal hubs; some products have more USB 2.0 than USB 3.2 hubs."

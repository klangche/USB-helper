# =============================================================================
# PureLink  –  Manufacturer guide
# =============================================================================
# From PureLink's "USB-C Technology" whitepaper v3 (Robin Cullen, 8 Oct 2025;
# not published yet). "USB supports a maximum of seven tiers along any
# individual connection path", and "this limit applies to the number of hubs
# connected in series, not the total number of hubs". PureLink recommends
# "keeping hub depth as low as practical, ideally within four tiers", "a
# conservative design preference, not a USB-IF limitation". Webcams and audio
# interfaces: "Limit to 3–4 tiers max". So PureLink counts tiers only.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: PureLink
selectable: true
proav: 1                              # 1: ProAV guide (marked in the menu), 0: general purpose
count: [tiers]                        # PureLink counts tiers on each path, not the total number of hubs
link:                                 # the whitepaper is not published yet

# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:                            # not counted by PureLink
    recommended:
    max:
  tiers:                           # "ideally within four tiers"; seven is the USB maximum
    recommended: 4
    max: 7
  chain:                           # not counted by PureLink
    recommended:
    max:
  buses:                              # empty: this guide's hubs above, then USB-Helper's
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:                       # "Limit to 3–4 tiers max" for webcams and audio
    tiers:
      recommended: 3
      max: 4
    chain:
      recommended: none
      max: none
  exceeded_note: "PureLink: keep hub depth within four tiers; cameras and audio within 3–4."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 0                            # macOS does not extend the desktop over DisplayPort MST (owner decision 2026-11-17)
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      apple-silicon:                    # M1 / M2 / M3 / M4 / M-series
        mst: 0
        limits: {}

      a-series:
        mst: 0
        limits: {}


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits: {}

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits: {}

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:
        mst: 0
        limits: {}


# -----------------------------------------------------------------------------
sources:
  - "PureLink, USB-C Technology whitepaper v3 (Robin Cullen, 8 Oct 2025), not published yet"
  - "PureLink: maximum seven tiers on a connection path; the limit is hubs in series, not the total number of hubs"
  - "PureLink: ideally within four tiers in ProAV; webcams and audio interfaces 3–4 tiers at most"

id: macos-apple-silicon
inherits: base
platform: macos
architecture: arm64
limits:
  max_hops: 4
  recommended_hops: 1
displays:
  mst: false
notes:
  - "Generic profile for Macs with an Apple chip (M-series or A-series)."
  - "max_hops 4: USB allows seven tiers on a path, so five hubs in a row (PureLink). M-series Macs use two of the seven tiers themselves (Lightware): a built-in hub level per port, which leaves four hubs (owner decision 2026-11-16). A-series Macs use three and set their own limits in their computer profile, as the MacBook Neo does."
  - "recommended_hops 1: PureLink recommends staying within four tiers where possible, a conservative design preference and not a USB-IF limit. Tier 4 is 1 hub in front of the device here."
sources:
  - "PureLink, USB-C whitepaper (not yet published; the link follows in #259): seven USB tiers on a path, four tiers recommended"
  - "https://www.lightware.com/en/news/macbook-neo-usbc-av-design-usb-topology-challenges (Lightware, 'MacBook Neo USB-C: Navigating hidden USB topology challenges in AV design', 2026-09-15: tiers used by M-series MacBooks and the MacBook Neo)"
  - "https://kb.plugable.com/en_US/understanding-mst-multi-display-setups-with-windows-macos-and-displayport (Plugable, 'Understanding MST: Multi-Display Setups with Windows, macOS, and DisplayPort', checked 2026-11-16: displays.mst)"
verification:
  status: partial
  last_checked: 2026-11-16

id: macos-apple-silicon
inherits: base
platform: macos
architecture: arm64
limits:
  max_hops: 5
  recommended_hops: 3
displays:
  mst: false
notes:
  - "Generic profile for Macs with an Apple chip (M-series or A-series)."
  - "Hop limits from the usb-script config (Mac Apple Silicon): max 5, recommended 3. Tested in practice, not a manufacturer specification."
  - "displays.mst false: macOS does not extend the desktop over DisplayPort MST; several displays on one DisplayPort output only mirror (Plugable, checked 2026-11-16; not an Apple statement)."
sources:
  - "https://github.com/klangche/usb-script/blob/main/usb-tree-config.json (platformStability.macAppleSilicon; config version 1.0.0, 2026-02-24)"
  - "https://plugable.com/blogs/news/understanding-multiple-displays-on-apple-silicon-macs (Plugable, 'Understanding Multiple Displays on Apple Silicon Macs': macOS does not support MST for extended displays)"
verification:
  status: partial
  last_checked: 2026-10-29

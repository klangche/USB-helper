id: android-tablet-exynos
inherits: base
platform: android
architecture: arm64
limits:
  max_hops: 4
  recommended_hops: 1
displays:
  mst: null
notes:
  - "Generic Android tablet profile (Exynos)."
  - "max_hops 4: from the usb-script config (Android Tablet (Exynos)). Tested in practice, not a manufacturer specification."
  - "recommended_hops 1: PureLink recommends staying within four tiers where possible, a conservative design preference and not a USB-IF limit. The 1 is derived, not measured: this profile keeps max_hops 4, one below the USB maximum, so its recommendation is also one below the 2 of a computer at the maximum (owner decision 2026-11-16)."
sources:
  - "https://github.com/klangche/usb-script/blob/main/usb-tree-config.json (platformStability.androidTablet; config version 1.0.0, 2026-02-24)"
  - "PureLink, USB-C whitepaper (not yet published; the link follows in #259): seven USB tiers on a path, four tiers recommended"
verification:
  status: partial
  last_checked: 2026-11-16

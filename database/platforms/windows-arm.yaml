id: windows-arm
inherits: base
platform: windows
architecture: arm64
limits:
  max_hops: 5
  recommended_hops: 2
displays:
  mst: true
notes:
  - "Generic Windows platform profile for ARM processors."
  - "max_hops 5: from the usb-script config (Windows ARM). Tested in practice, not a manufacturer specification. That is the USB maximum (PureLink)."
  - "recommended_hops 2: PureLink recommends staying within four tiers where possible, a conservative design preference and not a USB-IF limit. Tier 4 is 2 hubs in front of the device here."
sources:
  - "https://github.com/klangche/usb-script/blob/main/usb-tree-config.json (platformStability.windowsArm; config version 1.0.0, 2026-02-24)"
  - "PureLink, USB-C whitepaper (not yet published; the link follows in #259): seven USB tiers on a path, four tiers recommended"
  - "https://kb.plugable.com/en_US/understanding-mst-multi-display-setups-with-windows-macos-and-displayport (Plugable, 'Understanding MST: Multi-Display Setups with Windows, macOS, and DisplayPort', checked 2026-11-16: displays.mst)"
verification:
  status: partial
  last_checked: 2026-11-16

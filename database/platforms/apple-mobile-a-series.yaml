notes:
  - "Generic Apple A-series mobile device profile. Not a Mac computer profile."
  - "max_hops 3: USB allows seven tiers on a path, so five hubs in a row (PureLink). A-series devices use three of the seven tiers themselves, one more than M-series Macs (Lightware, measured on the MacBook Neo, which has an A-series chip), which leaves three hubs (owner decision 2026-11-16)."
  - "recommended_hops 0: PureLink recommends staying within four tiers where possible, a conservative design preference and not a USB-IF limit. Tier 4 is 0 hubs in front of the device here."
sources:
  - "PureLink, USB-C whitepaper (not yet published; the link follows in #259): seven USB tiers on a path, four tiers recommended"
  - "https://www.lightware.com/en/news/macbook-neo-usbc-av-design-usb-topology-challenges (Lightware, 'MacBook Neo USB-C: Navigating hidden USB topology challenges in AV design', 2026-09-15: tiers used by M-series MacBooks and the MacBook Neo)"

id: linux-arm
inherits: base
platform: linux
architecture: arm64
limits:
  max_hops: 5
  recommended_hops: 2
displays:
  mst: null
notes:
  - "Generic Linux platform profile for ARM processors."
  - "max_hops 5: from the usb-script config (Linux ARM). Tested in practice, not a manufacturer specification. That is the USB maximum (PureLink)."
  - "recommended_hops 2: PureLink recommends staying within four tiers where possible, a conservative design preference and not a USB-IF limit. Tier 4 is 2 hubs in front of the device here."
sources:
  - "https://github.com/klangche/usb-script/blob/main/usb-tree-config.json (platformStability.linuxArm; config version 1.0.0, 2026-02-24)"
  - "PureLink, USB-C whitepaper (not yet published; the link follows in #259): seven USB tiers on a path, four tiers recommended"
verification:
  status: partial
  last_checked: 2026-11-16

inherits: macos-apple-silicon
manufacturer: Apple Inc.
model: Mac17,5
name: MacBook Neo
chip: A18 Pro

limits:
  max_hubs: null
  max_tiers: null
  max_hops: 4

displays:
  max_external: 1
  restrictions:
    - "Apple: one external display with up to 4K resolution at 60 Hz, on the USB 3 port only."

ports:
  usb3:
    usb: usb-c
    displayport_alt_mode: true
    limitations:
      - "USB 3 data (up to 10 Gb/s) and DisplayPort video; supports charging."
  usb2:
    usb: usb-c
    displayport_alt_mode: false
    limitations:
      - "USB 2 data only (up to 480 Mb/s), no DisplayPort video; supports charging."

notes:
  - "MacBook Neo (model A3404). Model identifier Mac17,5."
  - "Lightware: the MacBook Neo uses three USB tiers by itself out of the USB specification's seven; typical M-series MacBooks use two. Both USB-C ports use three tiers."
  - "max_hops 4: the three tiers are the root hub, one internal hub and the device in the port, which leaves four external hubs within seven tiers (owner decision 2026-10-30, #11). The same reading gives five for typical M-series Macs, matching macos-apple-silicon. recommended_hops is inherited."
  - "displays.mst is inherited from macos-apple-silicon (false). Only the USB 3 port carries video, so a second DisplayPort display can only mirror the first."
  - "Partial: every value is cited, but the pages were checked through search results (2026-11-16), not on a MacBook Neo. max_hops is derived from Lightware's tier count, not stated by Apple or Lightware."
  - "Not known: whether macOS lists the internal hub as a hub. If it does, the app run on a MacBook Neo counts it as an external hub (it says so in the log) and judges one hub too strict."

sources:
  - "https://www.lightware.com/en/news/macbook-neo-usbc-av-design-usb-topology-challenges (Lightware, 'MacBook Neo USB-C: Navigating hidden USB topology challenges in AV design', 2026-09-15: tiers used, port capabilities)"
  - "https://www.inavateonthenet.net/products/article/lightware-addresses-macbook-neo-usb-topology-limitations (Inavate, 'Lightware addresses MacBook Neo USB topology limitations': both USB-C ports use three tiers)"
  - "https://support.apple.com/en-us/126322 (Apple, 'MacBook Neo - Tech Specs': one external display, the two USB-C ports)"
  - "https://theapplewiki.com/wiki/MacBook_Neo (The Apple Wiki, 'MacBook Neo': model identifier Mac17,5, model number A3404)"
  - "https://appledb.dev/device-selection/MacBook-Neo.html (AppleDB, 'MacBook Neo': model identifier Mac17,5, model A3404, A18 Pro)"


# =============================================================================
# Crestron  –  Manufacturer guide
# =============================================================================
# Based on Crestron’s USB Tiers knowledge article and product documentation
# for USB-EXT, DM-NUX and DM Essentials series.
#
# Crestron treats the USB-IF 7-tier limit as absolute. Every hub, extender or
# inline device adds at least one tier. Product sheets commonly allow up to
# 4 external hubs in a chain (plus the local/remote pair).
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: Crestron
selectable: true
proav: 1                              # 1: ProAV guide (marked in the menu), 0: general purpose
count: [tiers, hubs]                  # for now: the texts behind this guide are not verified yet
link: https://community.crestron.com/s/article/3082


# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:
    recommended: 3
    max: 4
  tiers:
    recommended: 5
    max: 7                            # USB-IF absolute maximum (Crestron enforces this)
  chain:                              # hubs daisy-chained in front of a device, built-in hub levels included
    recommended:
    max:
  buses:                              # empty: this guide's hubs above, then USB-Helper's
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:                       # isochronous devices should sit higher in the tree
    tiers:
      recommended: 3
      max: 5
    chain:
      recommended:
      max:
  exceeded_note: "USB topology is deep – devices may fail to enumerate (Crestron 7-tier limit)."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits:
          tiers:
            recommended: 4
            max: 6

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 0                            # macOS does not extend the desktop over DisplayPort MST (owner decision 2026-11-17)
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      apple-silicon:
        mst: 0
        limits:
          tiers:
            recommended: 4
            max: 6

      a-series:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:
        mst: 0
        limits: {}


# -----------------------------------------------------------------------------
sources:
  - "https://community.crestron.com/s/article/3082  (USB Tiers knowledge article)"
  - "Crestron USB-EXT-2 / USB-EXT-3 product documentation: up to 4 USB hubs supported in chain"
  - "DM-NUX series notes: refer to Knowledge Article 3082 for tier and bandwidth management"
  - "USB-IF maximum of 7 tiers; Crestron treats this as a hard limit"

# =============================================================================
# Desktop  –  General-purpose guide
# =============================================================================
# For everyday desks and offices rather than ProAV rooms: it follows the USB
# specification (USB-IF) and is more generous than the ProAV guides. Seven
# tiers on a path is the hard limit; there is no limit on the number of hubs.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: Desktop
selectable: true
proav: 0                              # 1: ProAV guide (marked in the menu), 0: general purpose


# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:
    recommended: none                 # the USB specification sets no hub count, only tiers
    max: none
  tiers:
    recommended: 6
    max: 7                            # USB-IF absolute maximum
  buses:                              # empty: this guide's hubs above, then USB-Helper's
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:
    tiers:
      recommended: 5
      max: 7
  exceeded_note: "Beyond the USB specification – devices may fail to enumerate."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits: {}

      arm:
        mst: 0
        limits: {}



# =============================================================================
# macOS

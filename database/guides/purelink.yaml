# USB-Helper guide file: the USB limits and recommendations of one guide, read by the USB-Helper app.
#
# How to fill it in
#   - Write a whole number, or none, after a key; do not add, remove or rename keys. Every guide file has
#     exactly this structure, with a section for every platform and chip; a file that differs is rejected.
#   - A number is your limit. An empty value means: use USB-Helper's value (guides/usb-helper.yaml).
#     none means: you state no limit here (USB-Helper's value is not used either).
#   - limits applies to all platforms; a platform's section overrides it, and a chip's section overrides
#     its platform's.
#   - recommended: above it the setup may be unreliable. max: above it the setup is unstable.
#
# Units
#   - hubs: external hubs, counted on each USB bus on its own (USB 2, USB 3), or all together when the
#     computer does not report the bus.
#   - tiers: USB tiers on a path, as the USB specification counts them: the computer with its root hub is
#     tier 1, each hub adds one, the device's own tier counts, and so do hubs built into the computer.
#   - hops: external hubs in front of a device.
#   - camera_audio: the same for cameras and audio devices, on top of the general limits.
#   - exceeded_note: a short text shown when a limit in that block is exceeded; at most 160 characters.
#   - mst: 1 when the platform or chip extends the desktop over DisplayPort Multi-Stream Transport, 0 when not.


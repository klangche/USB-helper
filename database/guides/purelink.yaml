# =============================================================================
# PureLink  –  Manufacturer guide
# =============================================================================
# Values taken from the PureLink USB-C whitepaper (Robin Cullen, Oct 2025).
# PureLink is more conservative than the USB-IF maximum, especially for
# isochronous devices (cameras / microphones).
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: PureLink
selectable: true
proav: 1                              # 1: ProAV guide (marked in the menu), 0: general purpose


# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:
    recommended: 3
    max: 5
  tiers:
    recommended: 4                    # PureLink recommended practice
    max: 7                            # USB-IF absolute maximum
  buses:                              # empty: this guide's hubs above, then USB-Helper's
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:                       # stricter for isochronous traffic
    tiers:
      recommended: 3
      max: 4
  exceeded_note: "Too many hubs/tiers – video or audio may drop frames."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits:
          tiers:
            recommended: 3            # AMD controllers sometimes less tolerant
            max: 6

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 0                            # macOS does not extend the desktop over DisplayPort MST (owner decision 2026-11-17)
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      apple-silicon:                    # M1 / M2 / M3 / M4 / M-series
        mst: 0
        limits:
          tiers:
            recommended: 4
            max: 6

      a-series:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:
        mst: 0
        limits: {}


# -----------------------------------------------------------------------------
sources:
  - "PureLink USB-C Technology whitepaper v3 (Robin Cullen, 8-Oct-2025)"
  - "USB-IF: maximum 7 tiers on a path; PureLink recommends ≤ 4 tiers in ProAV"
  - "PureLink: keep camera/audio devices within 3–4 tiers"

notes:
  - "Strict to PureLink's guide: four tiers recommended (a conservative design preference, not a USB-IF limit), seven at most; webcams and audio interfaces send a steady stream (isochronous transfers): limit to 3 to 4 tiers. Everything else is empty, so USB-Helper's values apply."
  - "Tiers count the chip's built-in hub levels, so on an A-series chip a device behind any hub is above four tiers: PureLink's rule, intended (owner decision 2026-11-17)."

sources:
  - "PureLink, USB-C whitepaper (not yet published; the link follows in #259): seven USB tiers on a path, four tiers recommended, three to four tiers for cameras and audio devices"


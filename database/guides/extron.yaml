# =============================================================================
# Extron  –  Manufacturer guide
# =============================================================================
# Based on Extron’s USB white paper and product manuals (USB Extender series,
# SW USB Pro, USB HUB4, etc.).
#
# Extron repeatedly states a practical “five cascading hub limit”. This is the
# USB-IF rule of max 5 non-root hubs expressed in their own language. Internal
# hubs inside the host PC and compound devices must be counted.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: Extron
selectable: true
proav: 1                              # 1: ProAV guide (marked in the menu), 0: general purpose
count: [tiers, hubs]                  # for now: the texts behind this guide are not verified yet
link: https://www.chariotgroup.com/wp-content/uploads/2021/01/usb_white_paper_Extron.pdf


# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:
    recommended: 3
    max: 5                            # Extron “five cascading hub limit”
  tiers:
    recommended: 5
    max: 7                            # USB-IF absolute maximum
  chain:                              # hubs daisy-chained in front of a device, built-in hub levels included
    recommended:
    max:
  buses:                              # empty: this guide's hubs above, then USB-Helper's
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:
    tiers:
      recommended: 3
      max: 5
    chain:
      recommended:
      max:
  exceeded_note: "Exceeding five cascading hubs – devices may drop or fail to enumerate."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits:
          tiers:
            recommended: 4
            max: 6

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 0                            # macOS does not extend the desktop over DisplayPort MST (owner decision 2026-11-17)
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      apple-silicon:
        mst: 0
        limits:
          tiers:
            recommended: 4
            max: 6

      a-series:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 5


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:
        mst: 0
        limits: {}


# -----------------------------------------------------------------------------
sources:
  - "Extron USB white paper – Cascading Hub Limit section (do not exceed five cascading hubs)"
  - "https://www.chariotgroup.com/wp-content/uploads/2021/01/usb_white_paper_Extron.pdf"
  - "Extron USB Extender / SW USB Pro manuals: ‘Do not connect more than five daisy-chained hubs’"
  - "USB-IF maximum of 7 tiers; Extron expresses the practical limit as 5 cascading hubs"

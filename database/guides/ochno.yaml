# =============================================================================
# Ochno  –  Manufacturer guide
# =============================================================================
# Ochno products (O-PC-4 / O-PC-4-NODE) contain 1–2 internal hubs.
# Because of that they recommend staying well below the USB-IF maximum
# when daisy-chaining or adding external hubs.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
# =============================================================================

name: Ochno
selectable: true


# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
limits:
  hubs:
    recommended: 2
    max: 4
  tiers:
    recommended: 4
    max: 6                            # stay under USB-IF 7 because of internal hubs
  hops:
    recommended: 2
    max: 3
  buses:                              # empty: USB-Helper's values per bus
    usb2:
      hubs:
        recommended:
        max:
    usb3:
      hubs:
        recommended:
        max:
    usb4:
      hubs:
        recommended:
        max:
  camera_audio:
    tiers:
      recommended: 3
      max: 4
    hops:
      recommended: 1
      max: 2
  exceeded_note: "Ochno units already contain internal hubs – keep the chain short."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1                            # O-PC-4 has internal DP MST
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits:
          tiers:
            recommended: 3
            max: 5

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 4
          hops:
            recommended: 1
            max: 2


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits: {}

      apple-silicon:
        mst: 1
        limits:
          tiers:
            recommended: 3
            max: 5

      a-series:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 4


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 4
          hops:
            recommended: 1
            max: 2


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 4
          hops:
            recommended: 1
            max: 2


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3
      hops:
        recommended: 1
        max: 2

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3
      hops:
        recommended: 1
        max: 2

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:
        mst: 0
        limits: {}


# -----------------------------------------------------------------------------
sources:
  - "Ochno O-PC-4 documentation (internal hubs = 1 or 2 depending on port)"
  - "Ochno recommendation: do not daisy-chain more than two O-PC-4 units"
  - "USB-IF maximum of 7 tiers; Ochno stays more conservative because of built-in hubs"

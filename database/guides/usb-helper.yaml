# =============================================================================
# USB-Helper  –  Base guide
# =============================================================================
# This is the default set of limits used by the USB-Helper app.
# Other manufacturer guides can inherit from this file or override values.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
#
# Keys
#   hubs            external hubs counted per bus
#   tiers           USB-IF tier count (host = tier 1)
#   hops            external hubs in front of a device
#   buses           hubs per bus (usb2, usb3, usb4); global or per chip
#   camera_audio    stricter limits for isochronous devices (webcams, mics)
# =============================================================================

name: USB-Helper
selectable: true


# -----------------------------------------------------------------------------
# Global defaults (used when a platform/chip does not override)
# -----------------------------------------------------------------------------
limits:
  hubs:
    recommended: 4
    max: 6
  tiers:
    recommended: 5
    max: 7
  hops:
    recommended: 4
    max: 6
  buses:                              # external hubs per bus; a chip may override
    usb2:
      hubs:
        recommended: 4
        max: 6
    usb3:
      hubs:
        recommended: 4
        max: 6
    usb4:
      hubs:
        recommended: 4
        max: 6
  camera_audio:
    tiers:
      recommended: 3
      max: 5
    hops:
      recommended: 2
      max: 4
  exceeded_note: "USB topology is getting deep – expect reduced reliability."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}                          # inherit global

    chips:
      intel:
        mst: 1
        limits:
          hops:
            recommended: 5
            max: 7

      amd:
        mst: 1
        limits:
          hops:
            recommended: 5
            max: 7

      arm:
        mst: 0
        limits:
          hops:
            recommended: 3
            max: 5


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 1
    limits: {}

    chips:
      intel:
        mst: 1
        limits:
          hops:
            recommended: 5
            max: 7

      apple-silicon:                    # M1 / M2 / M3 / M4 / M-series
        mst: 1
        limits:
          hops:
            recommended: 3
            max: 5

      a-series:                         # A-series Macs if they appear
        mst: 0
        limits:
          hops:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits:
          hops:
            recommended: 4
            max: 6

      amd:
        mst: 0
        limits:
          hops:
            recommended: 4
            max: 6

      arm:
        mst: 0
        limits:
          hops:
            recommended: 3
            max: 5


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits:
          hops:
            recommended: 4
            max: 6

      amd:
        mst: 0
        limits:
          hops:
            recommended: 4
            max: 6

      arm:
        mst: 0
        limits:
          hops:
            recommended: 3
            max: 5


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3
      hops:
        recommended: 2
        max: 4

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3
      hops:
        recommended: 2
        max: 4

    chips:
      phone-qualcomm:
        mst: 0
        limits:
          hops:
            recommended: 3
            max: 5

      tablet-exynos:
        mst: 0
        limits:
          hops:
            recommended: 2
            max: 4


# -----------------------------------------------------------------------------
sources:
  - "USB-Helper internal defaults (derived from usb-script platformStability, 2026)"
  - "USB-IF maximum of 7 tiers on a path"

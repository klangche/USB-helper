# =============================================================================
# USB-Helper  –  Base guide
# =============================================================================
# This is the default set of limits used by the USB-Helper app.
# Other manufacturer guides can inherit from this file or override values.
#
# How to edit
#   - Leave a value empty  → fall back to the value above it
#   - Write a number       → that is the limit
#   - Write "none"         → deliberately no limit
#
# No sources: the owner keeps USB-Helper's own reasoning in a separate document.
#
# Keys
#   hubs            external hubs counted per bus
#   tiers           USB-IF tier count (host = tier 1)
#   buses           hubs per bus (usb2, usb3, usb4); global or per chip
#   camera_audio    stricter limits for isochronous devices (webcams, mics)
# =============================================================================

name: USB-Helper
selectable: true


# -----------------------------------------------------------------------------
# Global defaults (used when a platform/chip does not override)
# -----------------------------------------------------------------------------
limits:
  hubs:
    recommended: 4
    max: 6
  tiers:
    recommended: 5
    max: 7
  buses:                              # external hubs per bus; a chip may override
    usb2:
      hubs:
        recommended: 4
        max: 6
    usb3:
      hubs:
        recommended: 4
        max: 6
    usb4:
      hubs:
        recommended: 4
        max: 6
  camera_audio:
    tiers:
      recommended: 3
      max: 5
  exceeded_note: "USB topology is getting deep – expect reduced reliability."


# =============================================================================
# WINDOWS
# =============================================================================
platforms:

  windows:
    mst: 1
    limits: {}                          # inherit global

    chips:
      intel:
        mst: 1
        limits: {}

      amd:
        mst: 1
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# macOS
# =============================================================================
  macos:
    mst: 0                            # macOS does not extend the desktop over DisplayPort MST (owner decision 2026-11-17)
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      apple-silicon:                    # M1 / M2 / M3 / M4 / M-series
        mst: 0
        limits: {}

      a-series:                         # A-series Macs if they appear
        mst: 0
        limits: {}


# =============================================================================
# LINUX: UBUNTU
# =============================================================================
  ubuntu:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# LINUX: DEBIAN
# =============================================================================
  debian:
    mst: 0
    limits: {}

    chips:
      intel:
        mst: 0
        limits: {}

      amd:
        mst: 0
        limits: {}

      arm:
        mst: 0
        limits: {}


# =============================================================================
# APPLE MOBILE  (iPhone / iPad)
# =============================================================================
  apple-mobile:
    mst: 0
    limits:
      hubs:
        recommended: 1
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      a-series:
        mst: 0
        limits: {}

      m-series:
        mst: 0
        limits: {}


# =============================================================================
# ANDROID
# =============================================================================
  android:
    mst: 0
    limits:                             # direct products only: any hub is potentially unstable
      hubs:
        recommended: 0
        max: 2
      tiers:
        recommended: 2
        max: 3

    chips:
      phone-qualcomm:
        mst: 0
        limits: {}

      tablet-exynos:                    # one built-in hub level, so one tier more than a phone
        mst: 0
        limits:
          tiers:
            recommended: 3
            max: 4


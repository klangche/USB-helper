notes:
  - "The default guide: it applies when no other guide is picked, and every empty value in another guide falls back to it. Every value is filled in (none where no limit is stated)."
  - "Values to be confirmed by the owner (2026-11-17): today's merged values, as hubs in front of a device: 5 hubs and 2 recommended without built-in hub levels, 4 / 1 on M-series and Android tablets, 3 / 1 on A-series. The recommendation is never below 1 hub, because a device behind no hub at all is not a real room (owner decision 2026-11-17, #284)."
  - "camera_audio.hops: one hub fewer than the general recommendation, never below 1, so 1 on every chip; the maximum is the general maximum (owner decisions 2026-11-17, #275 and #284)."
  - "tiers.max 7: the USB maximum (base.yaml)."
  - "mst: 1 on Windows, which extends the desktop over DisplayPort Multi-Stream Transport; 0 elsewhere, which is the default (owner decision 2026-11-17). macOS does not extend the desktop over MST (Plugable)."

sources:
  - "PureLink, USB-C whitepaper (not yet published; the link follows in #259): seven USB tiers on a path, four tiers recommended"
  - "https://www.lightware.com/en/news/macbook-neo-usbc-av-design-usb-topology-challenges (Lightware, 'MacBook Neo USB-C: Navigating hidden USB topology challenges in AV design', 2026-09-15: tiers used by M-series MacBooks and the MacBook Neo)"
  - "https://kb.plugable.com/en_US/understanding-mst-multi-display-setups-with-windows-macos-and-displayport (Plugable, 'Understanding MST: Multi-Display Setups with Windows, macOS, and DisplayPort', checked 2026-11-16: mst)"


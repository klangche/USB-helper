# A guide file. Every guide file has exactly this shape, with a section for every platform and chip in
# database/platforms/; only the header (name, selectable, notes, sources) and the numbers differ.
#   - An empty value means: use USB-Helper's value (guides/usb-helper.yaml).
#   - none means: this guide states no limit here.
#   - A chip's value wins over its platform's, which wins over the one under limits (all platforms).
#   - hubs: external hubs; the limit applies to each bus on its own (USB 2, USB 3), or to all hubs together
#     when the operating system does not report the bus.
#   - tiers: USB tiers on a path as the USB specification counts them: the host with its root hub is tier 1,
#     the device's own tier counts, and the chip's built-in hub levels count.
#   - hops: external hubs in front of a device.
#   - camera_audio: the same for cameras and audio devices, on top of the general limits.
#   - exceeded_note: shown with the finding when a limit in this block is exceeded; at most 160 characters.
#   - mst: 1 when the platform or chip extends the desktop over DisplayPort MST, 0 when not.

